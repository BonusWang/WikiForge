spring:
  application:
    name: wikiforge-core-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wikiforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:wikiforge}
    password: ${SPRING_DATASOURCE_PASSWORD:wikiforge}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${CORE_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wikiforge:
  release:
    version: ${WIKIFORGE_VERSION:2.0-v2-preview.4}
    stage: ${WIKIFORGE_RELEASE_STAGE:R6-version-api}
    release-date: ${WIKIFORGE_RELEASE_DATE:2026-05-24}
  storage:
    raw-sources-root: ${WIKIFORGE_RAW_SOURCES_ROOT:${WIKIFORGE_RAW_SOURCES_PATH:${WIKIFORGE_OBSIDIAN_VAULT_PATH:./data/obsidian-vault}/WikiForge/30_Resources_资源}}
  raw-sources-path: ${WIKIFORGE_RAW_SOURCES_PATH:${WIKIFORGE_RAW_SOURCES_ROOT:${WIKIFORGE_OBSIDIAN_VAULT_PATH:./data/obsidian-vault}/WikiForge/30_Resources_资源}}
  obsidian-vault-path: ${WIKIFORGE_OBSIDIAN_VAULT_PATH:./data/obsidian-vault}
  obsidian-vault-name: ${WIKIFORGE_OBSIDIAN_VAULT_NAME:WikiForgeVault}
  allowed-scan-roots: ${WIKIFORGE_ALLOWED_SCAN_ROOTS:}
  worker:
    base-url: ${WIKIFORGE_WORKER_BASE_URL:http://wikiforge-worker-service:8081}
  security:
    internal-api-token: ${WIKIFORGE_INTERNAL_API_TOKEN:}
    allowed-scan-roots: ${WIKIFORGE_ALLOWED_SCAN_ROOTS:}
