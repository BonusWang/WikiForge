spring:
  application:
    name: wikiforge-core-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wikiforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:wikiforge}
    password: ${SPRING_DATASOURCE_PASSWORD:wikiforge}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${CORE_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wikiforge:
  storage:
    raw-sources-root: ${WIKIFORGE_RAW_SOURCES_ROOT:${WIKIFORGE_RAW_SOURCES_PATH:./data/raw-sources}}
  raw-sources-path: ${WIKIFORGE_RAW_SOURCES_PATH:${WIKIFORGE_RAW_SOURCES_ROOT:./data/raw-sources}}
  obsidian-vault-path: ${WIKIFORGE_OBSIDIAN_VAULT_PATH:./data/obsidian-vault}
  obsidian-vault-name: ${WIKIFORGE_OBSIDIAN_VAULT_NAME:WikiForgeVault}
  allowed-scan-roots: ${WIKIFORGE_ALLOWED_SCAN_ROOTS:}
  worker:
    base-url: ${WIKIFORGE_WORKER_BASE_URL:http://wikiforge-worker-service:8081}
  security:
    internal-api-token: ${WIKIFORGE_INTERNAL_API_TOKEN:}
    allowed-scan-roots: ${WIKIFORGE_ALLOWED_SCAN_ROOTS:}
  model:
    provider: ${WIKIFORGE_MODEL_PROVIDER:}
    api-key: ${WIKIFORGE_MODEL_API_KEY:}
    providers:
      minimax:
        type: ${WIKIFORGE_MODEL_MINIMAX_TYPE:openai_compatible}
        api-key: ${WIKIFORGE_MODEL_MINIMAX_API_KEY:${WIKIFORGE_MINIMAX_API_KEY:${WIKIFORGE_MODEL_API_KEY:}}}
        base-url: ${WIKIFORGE_MODEL_MINIMAX_BASE_URL:${WIKIFORGE_MINIMAX_BASE_URL:https://api.minimax.io/v1}}
        model: ${WIKIFORGE_MODEL_MINIMAX_MODEL:${WIKIFORGE_MINIMAX_MODEL:}}
      deepseek:
        type: ${WIKIFORGE_MODEL_DEEPSEEK_TYPE:openai_compatible}
        api-key: ${WIKIFORGE_MODEL_DEEPSEEK_API_KEY:${WIKIFORGE_DEEPSEEK_API_KEY:}}
        base-url: ${WIKIFORGE_MODEL_DEEPSEEK_BASE_URL:${WIKIFORGE_DEEPSEEK_BASE_URL:}}
        model: ${WIKIFORGE_MODEL_DEEPSEEK_MODEL:${WIKIFORGE_DEEPSEEK_MODEL:}}
    minimax:
      api-key: ${WIKIFORGE_MINIMAX_API_KEY:${WIKIFORGE_MODEL_API_KEY:}}
      base-url: ${WIKIFORGE_MINIMAX_BASE_URL:https://api.minimax.io/v1}
      model: ${WIKIFORGE_MINIMAX_MODEL:}
