spring:
  application:
    name: wikiforge-orchestration-service

server:
  port: ${ORCHESTRATION_SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wikiforge:
  orchestration:
    workflow-entry: ${WIKIFORGE_WORKFLOW_ENTRY:WORKFLOW.md}
    project-roadmap: ${WIKIFORGE_PROJECT_ROADMAP:docs/current/2026-05-23-项目整体计划-WikiForge-project-roadmap.md}
    active-branch: ${WIKIFORGE_ACTIVE_BRANCH:codex/mvp5-mcp-preview}
