services:
  mysql:
    image: mysql:8.4
    container_name: wikiforge-dev-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wikiforge}
      MYSQL_USER: ${MYSQL_USER:-wikiforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wikiforge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wikiforge_root}
      TZ: Asia/Shanghai
    ports:
      - "${WIKIFORGE_PORT_BIND:-127.0.0.1}:3306:3306"
    volumes:
      - ../data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
