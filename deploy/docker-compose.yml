services:
  mysql:
    image: mysql:8.4
    container_name: wikiforge-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wikiforge}
      MYSQL_USER: ${MYSQL_USER:-wikiforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wikiforge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wikiforge_root}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ../data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  wikiforge-core-service:
    build:
      context: ..
      dockerfile: deploy/docker/core-service.Dockerfile
    container_name: wikiforge-core-service
    environment:
      CORE_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/wikiforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-wikiforge}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-wikiforge}
      WIKIFORGE_WORKER_BASE_URL: ${WIKIFORGE_WORKER_BASE_URL:-http://wikiforge-worker-service:8081}
      WIKIFORGE_INTERNAL_API_TOKEN: ${WIKIFORGE_INTERNAL_API_TOKEN:-change-me}
      WIKIFORGE_RAW_SOURCES_ROOT: ${WIKIFORGE_RAW_SOURCES_ROOT:-/data/wikiforge/raw-sources}
      WIKIFORGE_RAW_SOURCES_PATH: ${WIKIFORGE_RAW_SOURCES_ROOT:-/data/wikiforge/raw-sources}
      WIKIFORGE_OBSIDIAN_VAULT_PATH: ${WIKIFORGE_OBSIDIAN_VAULT_PATH:-/data/wikiforge/obsidian-vault}
      WIKIFORGE_OBSIDIAN_VAULT_NAME: ${WIKIFORGE_OBSIDIAN_VAULT_NAME:-WikiForgeVault}
      WIKIFORGE_ALLOWED_SCAN_ROOTS: ${WIKIFORGE_ALLOWED_SCAN_ROOTS:-/data/wikiforge/imports}
      WIKIFORGE_MODEL_PROVIDER: ${WIKIFORGE_MODEL_PROVIDER:-}
      WIKIFORGE_MODEL_API_KEY: ${WIKIFORGE_MODEL_API_KEY:-}
      WIKIFORGE_MODEL_MINIMAX_TYPE: ${WIKIFORGE_MODEL_MINIMAX_TYPE:-openai_compatible}
      WIKIFORGE_MODEL_MINIMAX_API_KEY: ${WIKIFORGE_MODEL_MINIMAX_API_KEY:-}
      WIKIFORGE_MODEL_MINIMAX_BASE_URL: ${WIKIFORGE_MODEL_MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      WIKIFORGE_MODEL_MINIMAX_MODEL: ${WIKIFORGE_MODEL_MINIMAX_MODEL:-}
      WIKIFORGE_MODEL_DEEPSEEK_TYPE: ${WIKIFORGE_MODEL_DEEPSEEK_TYPE:-openai_compatible}
      WIKIFORGE_MODEL_DEEPSEEK_API_KEY: ${WIKIFORGE_MODEL_DEEPSEEK_API_KEY:-}
      WIKIFORGE_MODEL_DEEPSEEK_BASE_URL: ${WIKIFORGE_MODEL_DEEPSEEK_BASE_URL:-}
      WIKIFORGE_MODEL_DEEPSEEK_MODEL: ${WIKIFORGE_MODEL_DEEPSEEK_MODEL:-}
      WIKIFORGE_MINIMAX_API_KEY: ${WIKIFORGE_MINIMAX_API_KEY:-}
      WIKIFORGE_MINIMAX_BASE_URL: ${WIKIFORGE_MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      WIKIFORGE_MINIMAX_MODEL: ${WIKIFORGE_MINIMAX_MODEL:-}
    ports:
      - "8080:8080"
    volumes:
      - ${WIKIFORGE_HOST_RAW_SOURCES_ROOT:-../data/raw-sources}:${WIKIFORGE_RAW_SOURCES_ROOT:-/data/wikiforge/raw-sources}
      - ${WIKIFORGE_HOST_OBSIDIAN_VAULT_PATH:-../data/obsidian-vault}:/data/wikiforge/obsidian-vault
      - ../data/imports:/data/wikiforge/imports
      - ../data/logs/core-service:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  wikiforge-worker-service:
    build:
      context: ..
      dockerfile: deploy/docker/worker-service.Dockerfile
    container_name: wikiforge-worker-service
    environment:
      WORKER_SERVER_PORT: 8081
      WIKIFORGE_CORE_SERVICE_BASE_URL: ${WIKIFORGE_CORE_SERVICE_BASE_URL:-http://wikiforge-core-service:8080}
      WIKIFORGE_INTERNAL_API_TOKEN: ${WIKIFORGE_INTERNAL_API_TOKEN:-change-me}
      WIKIFORGE_RAW_SOURCES_ROOT: ${WIKIFORGE_RAW_SOURCES_ROOT:-/data/wikiforge/raw-sources}
      WIKIFORGE_RAW_SOURCES_PATH: ${WIKIFORGE_RAW_SOURCES_ROOT:-/data/wikiforge/raw-sources}
      WIKIFORGE_OBSIDIAN_VAULT_PATH: ${WIKIFORGE_OBSIDIAN_VAULT_PATH:-/data/wikiforge/obsidian-vault}
      WIKIFORGE_OBSIDIAN_VAULT_NAME: ${WIKIFORGE_OBSIDIAN_VAULT_NAME:-WikiForgeVault}
      WIKIFORGE_ALLOWED_SCAN_ROOTS: ${WIKIFORGE_ALLOWED_SCAN_ROOTS:-/data/wikiforge/imports}
    ports:
      - "8081:8081"
    volumes:
      - ${WIKIFORGE_HOST_RAW_SOURCES_ROOT:-../data/raw-sources}:${WIKIFORGE_RAW_SOURCES_ROOT:-/data/wikiforge/raw-sources}
      - ${WIKIFORGE_HOST_OBSIDIAN_VAULT_PATH:-../data/obsidian-vault}:/data/wikiforge/obsidian-vault
      - ../data/imports:/data/wikiforge/imports
      - ../data/logs/worker-service:/app/logs
    depends_on:
      wikiforge-core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  wikiforge-orchestration-service:
    build:
      context: ..
      dockerfile: deploy/docker/orchestration-service.Dockerfile
    container_name: wikiforge-orchestration-service
    environment:
      ORCHESTRATION_SERVER_PORT: 8090
      WIKIFORGE_WORKFLOW_ENTRY: ${WIKIFORGE_WORKFLOW_ENTRY:-WORKFLOW.md}
      WIKIFORGE_PROJECT_ROADMAP: ${WIKIFORGE_PROJECT_ROADMAP:-docs/current/2026-05-23-项目整体计划-WikiForge-project-roadmap.md}
      WIKIFORGE_ACTIVE_BRANCH: ${WIKIFORGE_ACTIVE_BRANCH:-codex/mvp5-mcp-preview}
    ports:
      - "8090:8090"
    volumes:
      - ../data/logs/orchestration-service:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  wikiforge-ui:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: wikiforge-ui
    ports:
      - "3000:80"
    depends_on:
      wikiforge-core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep WikiForge"]
      interval: 10s
      timeout: 5s
      retries: 12

  wikiforge-orchestration-ui:
    build:
      context: ..
      dockerfile: deploy/docker/orchestration-ui.Dockerfile
    container_name: wikiforge-orchestration-ui
    ports:
      - "3001:80"
    depends_on:
      wikiforge-orchestration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep WikiForge"]
      interval: 10s
      timeout: 5s
      retries: 12
