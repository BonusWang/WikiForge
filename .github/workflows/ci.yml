name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend services
        run: mvn -B test

      - name: Package backend services
        run: mvn -B -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core service image
        run: docker build -f deploy/docker/core-service.Dockerfile -t wikiforge-core-service:ci .

      - name: Build worker service image
        run: docker build -f deploy/docker/worker-service.Dockerfile -t wikiforge-worker-service:ci .

      - name: Build UI image
        run: docker build -f deploy/docker/frontend.Dockerfile -t wikiforge-ui:ci .

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config
